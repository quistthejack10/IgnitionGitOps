[project]
name = "forge-common"
version = "0.0.1"
description = "Shared utilities for Forge Python services: settings, logging, NATS bus, metrics, schema models."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "nats-py>=2.7",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_common"]

[tool.ruff]
line-length = 100
target-version = "py311"
