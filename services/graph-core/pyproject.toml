[project]
name = "forge-graph-core"
version = "0.0.1"
description = "Forge graph core: property-graph store over Postgres+AGE and GraphQL-schema-from-model generation."
requires-python = ">=3.11"
dependencies = [
    "forge-common",
    "asyncpg>=0.29",
    "strawberry-graphql>=0.220",
]

[tool.uv.sources]
forge-common = { path = "../../libs/forge-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
