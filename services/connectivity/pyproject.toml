[project]
name = "forge-connectivity"
version = "0.0.1"
description = "Forge connectivity: Connections exposing Sources and Sinks (OPC-UA, MQTT/Sparkplug, TCP, SQL, REST) with store-and-forward."
requires-python = ">=3.11"
dependencies = [
    "forge-common",
    # Driver deps added per-driver in M3: asyncua, paho-mqtt, sqlalchemy, httpx, ...
]

[tool.uv.sources]
forge-common = { path = "../../libs/forge-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
