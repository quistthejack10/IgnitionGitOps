[project]
name = "forge-api-gateway"
version = "0.0.1"
description = "Forge API gateway: REST, generated GraphQL, inbound webhooks, and the MCP server."
requires-python = ">=3.11"
dependencies = [
    "forge-common",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "strawberry-graphql[fastapi]>=0.220",
    "mcp>=1.0",
]

[tool.uv.sources]
forge-common = { path = "../../libs/forge-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
