# Forge single-node dev stack (PRD §6.1 single-node gateway).
#
# M1: postgres now builds from deploy/postgres/Dockerfile (Postgres 16 + Apache AGE).
#     flow-engine is now live (connects to NATS for the polyglot seam proof).
#
# Bring up infra + flow-engine:
#     docker compose up -d postgres nats mqtt flow-engine

services:
  # Postgres 16 + Apache AGE (graph). TimescaleDB added in M2 (ADR-0001 resolved here).
  postgres:
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS JetStream — internal event bus (ADR-0003).
  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  # Embedded MQTT broker — exposes the UNS (ADR-0003, FR-C3).
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./deploy/compose/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  # Keycloak — OIDC identity, federates to AD/LDAP (FR-P1).
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]

  # Flow engine — wired to NATS in M1 (polyglot seam proof).
  flow-engine:
    build:
      context: .
      dockerfile: flow-engine/Dockerfile
    ports: ["8081:8081"]
    environment:
      FORGE_NATS_URL: nats://nats:4222
      FORGE_HEALTH_ADDR: ":8081"
    depends_on:
      nats:
        condition: service_started
    restart: on-failure

  # --- Wired in M2+ ---
  # api-gateway:
  #   build: { context: ., dockerfile: services/api-gateway/Dockerfile }
  #   ports: ["8000:8000"]
  #   environment:
  #     FORGE_NATS_URL: nats://nats:4222
  #     FORGE_POSTGRES_DSN: postgresql://forge:forge@postgres:5432/forge
  #   depends_on: [postgres, nats]

volumes:
  pgdata:
